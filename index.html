<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La noche de los tubos – Monumento interactivo</title>
<style>
  /* =========================================================
     COLORES Y TIPOGRAFÍA (se pueden cambiar acá)
     ========================================================= */
  :root{
    --fondo:#000;
    --texto:#f2ede6;
    --texto-suave:#b9b1a6;
    --acento:#e0a370;          /* cobre */
    --panel:#141110;
    --borde:#3a302a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--fondo);color:var(--texto);
    font-family:Georgia,"Times New Roman",serif}
  .escena{position:relative;max-width:900px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
  .instruccion{font-family:system-ui,Arial,sans-serif;font-size:14px;color:var(--texto-suave);
    text-align:center;margin:0 0 10px;letter-spacing:.02em}
  .monumento{position:relative;width:100%;max-width:min(720px, calc(82vh - 50px));margin:0 auto;line-height:0}
  .monumento img{width:100%;height:auto;display:block;user-select:none}
  .monumento svg{position:absolute;inset:0;width:100%;height:100%}

  /* ---- Zonas de los tubos ---- */
  .tubo{fill:rgba(224,163,112,0);stroke:rgba(224,163,112,0);stroke-width:.4;
    cursor:pointer;transition:fill .25s, stroke .25s;outline:none;
    vector-effect:non-scaling-stroke}
  .tubo:hover,.tubo:focus-visible,.tubo.activo{fill:rgba(224,163,112,.28);stroke:var(--acento);stroke-width:2}
  .pista .tubo{animation:pulso 2.4s ease-in-out 2}
  @keyframes pulso{50%{fill:rgba(224,163,112,.22);stroke:rgba(224,163,112,.8)}}

  /* ---- Etiqueta al pasar el cursor ---- */
  .etiqueta{position:absolute;pointer-events:none;transform:translate(-50%,-115%);
    background:var(--panel);border:1px solid var(--acento);color:var(--texto);
    padding:8px 12px;border-radius:6px;white-space:nowrap;font-size:16px;line-height:1.3;
    opacity:0;transition:opacity .15s;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.6)}
  .etiqueta small{display:block;font-family:system-ui,Arial,sans-serif;font-size:12px;color:var(--acento)}
  .etiqueta.visible{opacity:1}

  /* ---- Panel con la historia ---- */
  .fondo-panel{position:fixed;inset:0;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;
    transition:opacity .25s;z-index:10}
  .fondo-panel.abierto{opacity:1;pointer-events:auto}
  .panel{position:fixed;left:50%;top:50%;width:min(560px,calc(100% - 32px));max-height:calc(100% - 32px);
    overflow:auto;transform:translate(-50%,-46%);opacity:0;pointer-events:none;
    background:var(--panel);border:1px solid var(--borde);border-top:4px solid var(--acento);
    border-radius:8px;padding:28px 26px 24px;z-index:11;transition:opacity .25s, transform .25s}
  .panel.abierto{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
  .panel h2{margin:0 0 4px;font-size:28px;font-weight:normal;letter-spacing:.01em}
  .panel .dato{font-family:system-ui,Arial,sans-serif;font-size:13px;color:var(--acento);
    text-transform:uppercase;letter-spacing:.08em;margin:0 0 16px}
  .panel p{font-size:17px;line-height:1.6;margin:0 0 14px}
  .panel .cerrar{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--texto-suave);
    font-size:28px;line-height:1;cursor:pointer;padding:4px 8px}
  .panel .cerrar:hover{color:var(--texto)}
  .boton{display:inline-block;margin-top:6px;padding:11px 18px;background:var(--acento);color:#1a120c;
    text-decoration:none;border-radius:4px;font-family:system-ui,Arial,sans-serif;font-weight:600;font-size:15px}
  .boton:hover{filter:brightness(1.08)}

  /* ---- Modo edición (solo para ubicar las zonas) ---- */
  .editor{display:none;font-family:system-ui,Arial,sans-serif;font-size:13px;background:#1d1d1d;
    border:1px dashed #777;padding:12px;margin-top:12px;line-height:1.5}
  .editando .editor{display:block}
  .editando .monumento{cursor:crosshair}
  .editor textarea{width:100%;height:70px;background:#000;color:#9f9;border:1px solid #444;font-family:monospace}
  .editor button{margin-right:6px}
  .punto{fill:#0f0}
  .borrador{fill:rgba(0,255,0,.15);stroke:#0f0;stroke-width:1;vector-effect:non-scaling-stroke}
</style>
</head>

  <div class="editor" id="editor">
    <strong>Modo edición.</strong> Hacé clic en las esquinas del tubo (4 o más puntos) siguiendo el contorno.
    Copiá el texto de abajo y pegalo en el campo <code>zona</code> de la persona correspondiente.

    <button id="deshacer">Deshacer punto</button><button id="limpiar">Empezar otra zona</button>

<div class="fondo-panel" id="fondoPanel"></div>
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelNombre">
  <button class="cerrar" id="cerrar" aria-label="Cerrar">×</button>
  <h2 id="panelNombre"></h2>
  <p class="dato" id="panelDato"></p>
  <div id="panelTexto"></div>
  <a class="boton" id="panelEnlace" target="_top" rel="noopener">Leer la historia completa →</a>
</div>

<script>
/* =====================================================================
   DATOS DE CADA PERSONA — esto es lo único que hace falta editar.
   - zona:   puntos "x,y" en porcentaje de la imagen (0 a 100).
   - enlace: link a la sección de su historia en el StoryMap
             (en la historia publicada, pasá el cursor por el título de la
             sección y tocá el ícono de cadena para copiar el link).
   ===================================================================== */
const PERSONAS = [
  {
    nombre: "Alberto Luis Bedia",
    dato: "Operario de Dálmine Siderca · Secuestrado el 22/9/1976",
    texto: [
      "Obrero de la fábrica Dálmine Siderca, en Campana. Fue secuestrado el 22 de septiembre de 1976, la noche que se recuerda como “la noche de los tubos”.",
      "[Completar con su historia: familia, trabajo, militancia, destino, testimonios.]"
    ],
    enlace: "https://storymaps.arcgis.com/stories/5201520765d4411c9bf037cdfd08c6c9",
    zona: "28.1,0.0 39.6,0.0 40.0,73.3 28.5,73.3"
  },
  {
    nombre: "Armando Culzoni",
    dato: "Operario de Dálmine Siderca · Secuestrado el 22/9/1976",
    texto: [
      "Obrero de Dálmine Siderca, secuestrado en el mismo operativo del 22 de septiembre de 1976.",
      "[Completar con su historia.]"
    ],
    enlace: "https://storymaps.arcgis.com/stories/5201520765d4411c9bf037cdfd08c6c9",
    zona: "17.4,60.0 29.8,61.3 26.0,100.0 12.3,100.0"
  },
  {
    nombre: "Raúl Aroldo Moreno",
    dato: "Operario de Dálmine Siderca · Secuestrado el 22/9/1976",
    texto: [
      "Obrero de Dálmine Siderca, secuestrado en el mismo operativo del 22 de septiembre de 1976.",
      "[Completar con su historia.]"
    ],
    enlace: "https://storymaps.arcgis.com/stories/5201520765d4411c9bf037cdfd08c6c9",
    zona: "53.2,52.4 64.7,51.5 68.9,100.0 57.0,100.0"
  },
  {
    nombre: "Manuel Martínez",
    dato: "Secuestrado el 22/9/1976",
    texto: [
      "Secuestrado en el mismo operativo del 22 de septiembre de 1976, según la sentencia del Juicio Grande de Campo de Mayo.",
      "[Completar con su historia.]"
    ],
    enlace: "https://storymaps.arcgis.com/stories/5201520765d4411c9bf037cdfd08c6c9",
    zona: "76.6,31.6 89.4,30.6 90.2,100.0 77.4,100.0"
  }
];

/* ===================== No hace falta tocar nada debajo ===================== */
const NS = "http://www.w3.org/2000/svg";
const capa = document.getElementById("capa");
const etiqueta = document.getElementById("etiqueta");
const monumento = document.getElementById("monumento");
const panel = document.getElementById("panel");
const fondoPanel = document.getElementById("fondoPanel");
let ultimoFoco = null;

function centro(zona){
  const p = zona.trim().split(/\s+/).map(s => s.split(",").map(Number));
  const xs = p.map(a=>a[0]), ys = p.map(a=>a[1]);
  return { x:(Math.min(...xs)+Math.max(...xs))/2, y:Math.min(...ys) };
}

function mostrarEtiqueta(persona){
  const c = centro(persona.zona);
  etiqueta.innerHTML = persona.nombre + "<small>Hacé clic para ver su historia</small>";
  etiqueta.style.left = c.x + "%";
  etiqueta.style.top = Math.max(c.y, 8) + "%";
  etiqueta.classList.add("visible");
}
function ocultarEtiqueta(){ etiqueta.classList.remove("visible"); }

function abrirPanel(persona, poligono){
  ultimoFoco = poligono;
  document.querySelectorAll(".tubo.activo").forEach(t=>t.classList.remove("activo"));
  poligono.classList.add("activo");
  document.getElementById("panelNombre").textContent = persona.nombre;
  document.getElementById("panelDato").textContent = persona.dato;
  const cont = document.getElementById("panelTexto");
  cont.innerHTML = "";
  persona.texto.forEach(t => { const p=document.createElement("p"); p.textContent=t; cont.appendChild(p); });
  const a = document.getElementById("panelEnlace");
  if (persona.enlace){ a.href = persona.enlace; a.style.display=""; } else { a.style.display="none"; }
  panel.classList.add("abierto"); fondoPanel.classList.add("abierto");
  ocultarEtiqueta();
  document.getElementById("cerrar").focus();
}
function cerrarPanel(){
  panel.classList.remove("abierto"); fondoPanel.classList.remove("abierto");
  document.querySelectorAll(".tubo.activo").forEach(t=>t.classList.remove("activo"));
  if (ultimoFoco) ultimoFoco.focus();
}

PERSONAS.forEach(persona => {
  const pol = document.createElementNS(NS, "polygon");
  pol.setAttribute("points", persona.zona);
  pol.setAttribute("class", "tubo");
  pol.setAttribute("tabindex", "0");
  pol.setAttribute("role", "button");
  pol.setAttribute("aria-label", persona.nombre + ": ver su historia");
  pol.addEventListener("mouseenter", () => mostrarEtiqueta(persona));
  pol.addEventListener("mouseleave", ocultarEtiqueta);
  pol.addEventListener("focus", () => mostrarEtiqueta(persona));
  pol.addEventListener("blur", ocultarEtiqueta);
  pol.addEventListener("click", () => abrirPanel(persona, pol));
  pol.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); abrirPanel(persona, pol);} });
  capa.appendChild(pol);
});

document.getElementById("cerrar").addEventListener("click", cerrarPanel);
fondoPanel.addEventListener("click", cerrarPanel);
document.addEventListener("keydown", e => { if (e.key==="Escape") cerrarPanel(); });
/* Ajusta el monumento para que entre completo en la altura visible (útil dentro de StoryMaps) */
const foto = document.getElementById("foto");
function ajustarAlto(){
  if (!foto.naturalWidth) return;
  const alto = window.innerHeight * 0.82 - 50;
  monumento.style.maxWidth = Math.min(720, Math.max(260, alto * foto.naturalWidth / foto.naturalHeight)) + "px";
}
foto.addEventListener("load", ajustarAlto);
window.addEventListener("resize", ajustarAlto);
ajustarAlto();
setTimeout(()=>document.getElementById("escena").classList.remove("pista"), 5200);

/* ---------- Modo edición: abrir el archivo con ?editar=1 al final ---------- */
if (new URLSearchParams(location.search).has("editar")){
  document.getElementById("escena").classList.add("editando");
  capa.querySelectorAll(".tubo").forEach(t => t.style.pointerEvents="none");
  capa.querySelectorAll(".tubo").forEach(t => { t.style.fill="rgba(224,163,112,.25)"; t.style.stroke="#e0a370"; t.style.strokeWidth="1"; });
  const salida = document.getElementById("salida");
  let puntos = [];
  const borrador = document.createElementNS(NS,"polygon"); borrador.setAttribute("class","borrador"); capa.appendChild(borrador);
  function dibujar(){
    const txt = puntos.map(p=>p.join(",")).join(" ");
    borrador.setAttribute("points", txt);
    capa.querySelectorAll(".punto").forEach(c=>c.remove());
    puntos.forEach(p=>{ const c=document.createElementNS(NS,"ellipse"); c.setAttribute("class","punto");
      c.setAttribute("cx",p[0]); c.setAttribute("cy",p[1]); c.setAttribute("rx",.7); c.setAttribute("ry",.7); capa.appendChild(c); });
    salida.value = txt;
  }
  monumento.addEventListener("click", e => {
    const r = monumento.getBoundingClientRect();
    const x = ((e.clientX - r.left)/r.width*100).toFixed(1);
    const y = ((e.clientY - r.top)/r.height*100).toFixed(1);
    puntos.push([x,y]); dibujar();
  });
  document.getElementById("deshacer").onclick = () => { puntos.pop(); dibujar(); };
  document.getElementById("limpiar").onclick = () => { puntos = []; dibujar(); };
}
</script>
</body>
